# Independent stage audit. Verification disabled at launch; host validates the
# complete JSON, freezes advance expectations, then runs copied-task probes.
# Timeout multiplier uses existing cfg[judge].budget_min, with no token caps.
version = "1.0"

[agent]
timeout_sec = 2400.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 20480
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
